# robustmargin packaging: setuptools, a src/ layout, an SPDX license expression, a py.typed
# marker and Python 3.11+.

[build-system]
# setuptools >= 77 is required, not >= 68: PEP 639's SPDX string form of `license` and the
# `license-files` key both landed in 77. The older `license = { text = ... }` table form is not
# an SPDX license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robustmargin"
description = "Robustness margins with confidence intervals, via dose-response threshold estimation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "robustmargin contributors" }]
dynamic = ["version"]

# PyPI discovery facets. No `License ::` classifier: PEP 639 makes the SPDX `license` field
# above canonical, and declaring both can conflict.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# The only runtime dependencies, deliberately: no GPU, ML-framework or domain-specific package.
# Floors stay loose and CI tests at the floor, so robustmargin never forces a numpy or scipy
# version onto a consumer's environment. `ci/constraints-min.txt` holds the same three numbers;
# if the two disagree, one of them is wrong.
dependencies = [
    "numpy>=1.26",
    # 1.11.1, not 1.11.0: scipy 1.11.0 was yanked from PyPI for a licence violation, so it is
    # not a floor any consumer can actually resolve to.
    "scipy>=1.11.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/robustmargin/robustmargin"
Source = "https://github.com/robustmargin/robustmargin"
Changelog = "https://github.com/robustmargin/robustmargin/blob/main/CHANGELOG.md"
Issues = "https://github.com/robustmargin/robustmargin/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# The version literal lives in exactly one place: src/robustmargin/__init__.py.
version = { attr = "robustmargin.__version__" }

[tool.setuptools.package-data]
# A missing py.typed fails silently and disables type checking for every consumer, which is
# why CI asserts it is present inside the built wheel and not merely on disk. The score-card
# schema is read at runtime by `robustmargin.report.load_schema`, so the same check covers it.
robustmargin = ["py.typed", "schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The selection is explicit rather than `extend-select` on top of ruff's default, because
# ruff's default is not stable across versions: ruff 0.16 enables 413 rules by default where
# ruff 0.5 enabled roughly sixty. `dev` declares `ruff>=0.5` with a loose floor, so relying on
# the default would let a ruff release change what CI enforces without any change here.
#
# E and F are the pycodestyle errors and pyflakes. `I` (isort) is added so that every import is
# sorted and grouped, which keeps a review of imports against the dependency list feasible.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# Neither statsmodels nor scipy ships a `py.typed` marker, so mypy cannot see their types.
# (numpy does, and is deliberately absent from this list.) A module-level override keeps the
# suppression in one declared place instead of spraying `# type: ignore` comments through the
# source.
module = ["statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: coverage simulations and other long-running checks",
]
addopts = [
    "-v",
    "--strict-markers",
    # The coverage simulations are 2,000 replicates per design and are marked
    # `slow`. They are excluded here so the default run -- and every leg of CI's four-way
    # matrix, which invokes a bare `pytest` -- stays fast, and so the 90% gate below measures
    # the fast suite. Run them with `pytest -m slow --no-cov`; a later `-m` overrides this one.
    "-m", "not slow",
    "--cov=robustmargin",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
