# robustmargin CI. ROADMAP section 2's "no CI-as-a-service" non-goal forbids *building* a CI
# service; using GitHub Actions is what zeta-bench already does.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # mypy is configured with files = ["src"] and strict = true in pyproject.toml.
      - run: mypy

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Four jobs, not a 3x2 cross product. The minimum-versions entry is Python 3.11 only
      # because the floor set is not installable above it: numpy 1.26.0 and scipy 1.11.0 both
      # declare python_requires <3.13, and neither they nor statsmodels 0.14.0 publish cp313
      # wheels. A newer interpreter only ever resolves to newer dependencies, so testing the
      # floor on 3.11 is the entire guarantee plan R9 asks for. See ci/constraints-min.txt.
      # Do not expand this into a full cross product; it cannot resolve.
      matrix:
        include:
          - python-version: "3.11"
            deps: latest
          - python-version: "3.12"
            deps: latest
          - python-version: "3.13"
            deps: latest
          - python-version: "3.11"
            deps: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip

      - name: Install (latest dependencies)
        if: matrix.deps == 'latest'
        run: pip install -e ".[dev]"

      - name: Install (dependency floors)
        if: matrix.deps == 'minimum'
        run: pip install -e ".[dev]" -c ci/constraints-min.txt

      - name: Record resolved versions
        run: |
          python -c "import numpy, scipy, statsmodels; \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('statsmodels', statsmodels.__version__)"

      # The 90% coverage gate lives in pyproject.toml's addopts, not here, so the number is
      # not duplicated between the config and the workflow.
      - run: pytest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: htmlcov-py${{ matrix.python-version }}-${{ matrix.deps }}
          path: htmlcov/
          retention-days: 7

  coverage-simulations:
    name: coverage simulations (plan 6.3)
    runs-on: ubuntu-latest
    # Plan section 6.3's simulations are 2,000 replicates per design. They are excluded from
    # the `test` matrix by pyproject.toml's `-m "not slow"`, and run here once, on one
    # interpreter, rather than four times. `pull_request` only: they guard a statistical
    # property that cannot regress without a source change, so a push to main re-running them
    # buys nothing. The numbers they produce are recorded in docs/validation.md.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # About 34 min before 0.1.0; about 52 min since, because every fit_dose_response call also
    # refits the other two links for Diagnostics (decisions/0023). A flag that skips the link
    # comparison would bring this back down, and needs its own decision.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # A later -m overrides pyproject.toml's. --no-cov because the 90% gate is the fast
      # suite's measurement and this run would distort it. `-s` is load-bearing: the whole
      # point of this job is the coverage table these tests print, and pytest captures stdout
      # for passing tests, so without it the job burns half an hour and logs nothing but
      # PASSED. docs/validation.md quotes these numbers, so they have to be readable here.
      - run: pytest -m slow --no-cov -s

  package:
    name: packaging shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # build and twine are deliberately not in the dev extra: they are needed here and
      # nowhere else, and the dev extra is the list the implementation plan specifies.
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # py.typed, every packaged schema, LICENSE, and no private files. The release workflow
      # runs the same script, so there is one copy of these checks.
      - run: python tools/check_dist.py
