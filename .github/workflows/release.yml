# Publishes a tagged release to TestPyPI, verifies it installs, then publishes to PyPI.
# A pre-release tag (PEP 440 a/b/rc, e.g. v0.1.1rc1) stops after the TestPyPI install check:
# it is a dry run of the whole pipeline and never reaches PyPI (decisions/0024).
# decisions/0024: PyPI Trusted Publishing (OIDC), no API token stored anywhere. The `pypi`
# environment requires the owner's approval, so nothing reaches PyPI without it.
#
# One-time setup, done by the owner:
#   - pypi.org and test.pypi.org: add a pending publisher for project `marginkit`,
#     owner `marginkit` (the GitHub organization), repository `marginkit`, workflow `release.yml`,
#     environment `pypi` (pypi.org) or `testpypi` (test.pypi.org).
#   - GitHub: create environments `testpypi` and `pypi`, the latter with the owner as a
#     required reviewer and deployment restricted to `v*` tags.
name: release

on:
  push:
    tags: ["v*"]

# One release at a time; never cancel a publish that is under way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tag must name the version the code carries, or the upload would publish one
      # version's code under another's number.
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import ast,pathlib; t=ast.parse(pathlib.Path("src/marginkit/__init__.py").read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(getattr(x, "id", None) == "__version__" for x in n.targets)))')"
          echo "tag=$tag code=$code"
          test "$tag" = "$code"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          pip install packaging
          prerelease="$(python -c "from packaging.version import Version; print(str(Version('$tag').is_prerelease).lower())")"
          echo "prerelease=$prerelease"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python tools/check_dist.py --expect-version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/marginkit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TestPyPI does not mirror numpy, scipy or statsmodels, so dependencies come from PyPI
      # and only marginkit itself from TestPyPI. --no-cache-dir and the retry loop allow for the
      # index taking a minute to show a fresh upload.
      - run: |
          v="${{ needs.build.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            pip install --no-cache-dir --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "marginkit==$v" && break
            sleep 30
          done
          python -c "import marginkit; assert marginkit.__version__ == '$v', marginkit.__version__; print('installed marginkit', marginkit.__version__)"

  pypi:
    name: publish to PyPI
    needs: [build, verify-testpypi]
    # Pre-releases are TestPyPI dry runs only.
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/marginkit/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
